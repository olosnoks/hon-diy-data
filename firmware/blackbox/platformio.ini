; hondalog black box. Build:  pio run      Flash:  pio run -t upload
; Plain ESP-IDF works too:    idf.py set-target esp32s3 && idf.py build
[platformio]
src_dir = main
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@^6.9.0          ; ESP-IDF 5.3
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB          ; N16R8 module; N8R8: set 8MB here and in sdkconfig.defaults
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200

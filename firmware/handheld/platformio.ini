; hondalog handheld (Sunton ESP32-4827S043N). Build:  pio run   Flash:  pio run -t upload
; Plain ESP-IDF 5.3 works too:  idf.py set-target esp32s3 && idf.py build
; FPS / render time / CPU overlay:  pio run -e esp32s3-perf
[platformio]
src_dir = main
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0           ; ESP-IDF 5.3.1; pinned, LVGL 9.2.2 is pinned in main/idf_component.yml
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB          ; N16R8 module
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32s3-perf]
extends = env:esp32s3
build_flags = -DHH_UI_PERF=1

; GPS plugged into header P1 (UART0 RX, next to the USB-C) instead of P4. UART0 is
; then no longer the serial console; flashing over USB-C still works.
[env:esp32s3-gps-p1]
extends = env:esp32s3
build_flags = -DHH_GPS_P1=1
board_build.cmake_extra_args = -DHH_GPS_P1=1 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.gps_p1"

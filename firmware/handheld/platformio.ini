; hondalog handheld (Sunton ESP32-4827S043N). Build:  pio run   Flash:  pio run -t upload
; Plain ESP-IDF 5.3 works too:  idf.py set-target esp32s3 && idf.py build
; FPS / render time / CPU overlay:  pio run -e esp32s3-perf
[platformio]
src_dir = main
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0           ; ESP-IDF 5.3.1; pinned, LVGL 9.2.2 is pinned in main/idf_component.yml
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB          ; N16R8 module
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32s3-perf]
extends = env:esp32s3
build_flags = -DHH_UI_PERF=1

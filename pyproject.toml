[project]
name = "hondalog"
version = "0.2.1"
description = "Live data logger for pre-2002 Honda ECUs over a KKL K-line cable"
requires-python = ">=3.11"
dependencies = ["PySide6", "pyqtgraph", "pyserial", "numpy", "esptool>=5"]

[project.optional-dependencies]
gl = ["PyOpenGL"]            # 3D views; without it Map 3D and Tune use the 2D heat map
test = ["pytest", "pytest-qt"]

[project.scripts]
hondalog = "hondalog.__main__:main"
hondalog-sim = "hondalog.sim:main"
hondalog-firstcontact = "hondalog.diag.firstcontact:main"
hondalog-probe = "hondalog.diag.ecuprobe:main"
hondalog-map = "hondalog.mapping.__main__:main"
hondalog-log = "hondalog.logtool:main"
hondalog-bb = "hondalog.blackbox.__main__:main"
hondalog-bbsim = "hondalog.blackbox.sim:main"
hondalog-tune = "hondalog.tuning.cli:main"
hondalog-handheld = "hondalog.handheld.cli:main"
hondalog-cydsim = "hondalog.handheld.cydsim:main"

[tool.setuptools]
packages = ["hondalog", "hondalog.ui", "hondalog.ui.screens", "hondalog.link", "hondalog.diag", "hondalog.expr",
            "hondalog.mathch", "hondalog.alarms", "hondalog.mapping", "hondalog.bench",
            "hondalog.data", "hondalog.analysis", "hondalog.export", "hondalog.triggers",
            "hondalog.blackbox", "hondalog.tuning", "hondalog.handheld", "hondalog.geo"]

[tool.setuptools.package-data]
hondalog = ["data/*", "data/fonts/*", "tuning/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
